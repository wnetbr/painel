o VPN<\/label><strong id=\"statConfig\">—<\/strong><small id=\"statProtocol\">Aguardando leitura<\/small><\/div><\/div>\n<div class=\"grid\"><div class=\"card\"><div class=\"card-header\"><h3>Gerenciamento<\/h3><span class=\"count-label\">Wnet<\/span><\/div><div id=\"sourceRows\"><\/div><\/div><div class=\"card\" hidden><div class=\"card-header\"><h3>Nesta sessão<\/h3><span class=\"badge\">LOCAL<\/span><\/div><div class=\"card-body\" id=\"activity\"><p class=\"help-text\">Conecte sua conta para carregar os dados atuais. Nenhuma informação de acesso fica embutida neste arquivo.<\/p><\/div><\/div><\/div>\n<\/section>\n<section id=\"users\" class=\"section\" hidden><div class=\"page-head\"><div><div class=\"eyebrow\">AUTORIZAÇÃO DO APLICATIVO<\/div><h1>Acessos<\/h1><p>Adicione, edite ou remova os nomes e senhas da lista.<\/p><\/div><span class=\"badge\" id=\"userCount\">Não carregado<\/span><\/div><div class=\"card\"><div class=\"card-header\"><input id=\"search\" class=\"searchbar\" type=\"search\" placeholder=\"Buscar na lista\" aria-label=\"Buscar acessos\"><div class=\"toolbar\"><button id=\"reveal\" class=\"quiet\">Mostrar valores<\/button><button id=\"addUser\" class=\"primary\" disabled>+ Novo acesso<\/button><\/div><\/div><div id=\"userList\" class=\"empty\">Conecte o Google para carregar os acessos.<\/div><div class=\"action-footer\"><span class=\"status-line\" id=\"usersStatus\">Aguardando conexão<\/span><div class=\"toolbar\"><button data-discard=\"users\" disabled>Descartar<\/button><button data-save=\"users\" class=\"primary\" disabled>Salvar acessos<\/button><\/div><\/div><\/div><p class=\"help-text\">Cada cadastro corresponde a uma linha do documento. A remoção passa a valer quando o aplicativo consultar novamente a lista.<\/p><\/section>\n<section id=\"access\" class=\"section\" hidden><div class=\"page-head\"><div><div class=\"eyebrow\">COMANDOS DO APLICATIVO<\/div><h1>Tela de acesso<\/h1><p>Escolha o comando que será gravado no documento.<\/p><\/div><\/div><div class=\"card\"><div class=\"card-header\"><h3>Controle de acesso<\/h3><span class=\"badge\" id=\"currentCommand\">Não carregado<\/span><\/div><div class=\"card-body\"><div class=\"command-grid\"><button class=\"command\" data-command=\"ativado\" aria-pressed=\"false\" disabled><strong>Ativado<\/strong><span>Enviar o comando ativado.<\/span><\/button><button class=\"command\" data-command=\"desativado\" aria-pressed=\"false\" disabled><strong>Desativado<\/strong><span>Enviar o comando desativado.<\/span><\/button><button class=\"command\" data-command=\"reset\" aria-pressed=\"false\" disabled><strong>Reset<\/strong><span>Enviar o comando reset.<\/span><\/button><\/div><p class=\"help-text\" style=\"margin-top:24px\">O painel envia a palavra exata ao documento. O comportamento e o tempo de resposta são definidos pelo aplicativo. O comando reset permanece até você salvar outro comando.<\/p><\/div><div class=\"action-footer\"><span id=\"accessStatus\" class=\"status-line\">Aguardando conexão<\/span><div class=\"toolbar\"><button data-discard=\"access\" disabled>Descartar<\/button><button data-save=\"access\" class=\"primary\" disabled>Salvar comando<\/button><\/div><\/div><\/div><\/section>\n<section id=\"config\" class=\"section\" hidden><div class=\"page-head\"><div><div class=\"eyebrow\">CONEXÃO DO APLICATIVO<\/div><h1>Configuração VPN<\/h1><p>Edite os campos principais ou a configuração completa.<\/p><\/div><\/div><div class=\"card\"><div class=\"card-header\"><h3>Servidor principal<\/h3><span class=\"badge\" id=\"protocolBadge\">Não carregado<\/span><\/div><div class=\"card-body\"><div id=\"configFormNotice\" class=\"notice\" hidden><\/div><div class=\"form-grid\" id=\"configFields\"><div class=\"field\"><label for=\"cfgName\">Nome da configuração<\/label><input id=\"cfgName\" data-cfg=\"remarks\" disabled autocomplete=\"off\"><\/div><div class=\"field\"><label for=\"cfgAddress\">Endereço do servidor<\/label><input id=\"cfgAddress\" data-cfg=\"address\" disabled autocomplete=\"off\" spellcheck=\"false\"><\/div><div class=\"field\"><label for=\"cfgPort\">Porta<\/label><input id=\"cfgPort\" data-cfg=\"port\" type=\"number\" min=\"1\" max=\"65535\" disabled><\/div><div class=\"field\"><label for=\"cfgUUID\">UUID<\/label><input id=\"cfgUUID\" data-cfg=\"id\" type=\"password\" disabled autocomplete=\"off\"><\/div><div class=\"field\"><label for=\"cfgSNI\">SNI / nome TLS<\/label><input id=\"cfgSNI\" data-cfg=\"serverName\" disabled spellcheck=\"false\"><\/div><div class=\"field\"><label for=\"cfgHost\">Host XHTTP<\/label><input id=\"cfgHost\" data-cfg=\"host\" disabled spellcheck=\"false\"><\/div><div class=\"field full\"><label for=\"cfgPath\">Caminho XHTTP<\/label><input id=\"cfgPath\" data-cfg=\"path\" disabled spellcheck=\"false\"><\/div><\/div><details id=\"advanced\"><summary>Configuração completa · JSON<\/summary><div class=\"spacer\"><\/div><label for=\"jsonEditor\">Conteúdo completo do documento<\/label><textarea id=\"jsonEditor\" class=\"code\" spellcheck=\"false\" disabled aria-describedby=\"jsonFeedback\"><\/textarea><div class=\"toolbar\" style=\"margin-top:12px\"><button id=\"formatJSON\" disabled>Formatar JSON<\/button><span id=\"jsonFeedback\" class=\"small\">Aguardando leitura<\/span><\/div><\/details><\/div><div class=\"action-footer\"><span id=\"configStatus\" class=\"status-line\">Aguardando conexão<\/span><div class=\"toolbar\"><button data-discard=\"config\" disabled>Descartar<\/button><button data-save=\"config\" class=\"primary\" disabled>Salvar configuração<\/button><\/div><\/div><\/div><p class=\"help-text\">Os campos principais preservam os demais parâmetros. JSON válido não garante que o servidor esteja disponível ou que a VPN conecte.<\/p><\/section>\n<section id=\"setup\" class=\"section\" hidden>\n<div class=\"page-head\"><div><div class=\"eyebrow\">SUA CONTA<\/div><h1>Conecte. E pronto.<\/h1><p>A conexão da Wnet já está configurada.<\/p><\/div><\/div>\n<div class=\"setup-panel\"><div class=\"card\"><div class=\"card-header\"><h3>Conta Google<\/h3><span class=\"badge ok\">ID CONFIGURADO<\/span><\/div><div class=\"card-body\"><div class=\"google-emblem\" aria-hidden=\"true\">G<\/div><h2>Seu painel está pronto.<\/h2><p>Entre com a conta que pode editar os documentos da Wnet. O Google abre a janela de autorização para você.<\/p><input id=\"clientId\" type=\"hidden\"><button id=\"saveClient\" hidden>Salvar configuração<\/button><button id=\"connectSetup\" class=\"primary\">Conectar Google<\/button>\n<div class=\"preferences\"><label class=\"toggle-row\"><input id=\"rememberLogin\" type=\"checkbox\" checked><span>Manter conectado neste navegador<small>Reconhecer este dispositivo enquanto a autorização estiver válida.<\/small><\/span><\/label><label class=\"toggle-row\"><input id=\"autoRefresh\" type=\"checkbox\" checked><span>Atualização automática<small>Consultar os documentos a cada 15 segundos com o painel aberto.<\/small><\/span><\/label><\/div><\/div><\/div>\n<div class=\"card\"><div class=\"card-body\"><h3>Sobre a conexão<\/h3><p class=\"help-text\">As mudanças são enviadas ao Google quando você salva e confirma. O aplicativo recebe os novos dados na próxima consulta aos documentos.<\/p><details style=\"margin-top:18px\"><summary>Ajuda para entrar<\/summary><p class=\"help-text\">Se o Google informar que o app está em teste, adicione seu e-mail em Google Auth Platform → Público → Usuários de teste. Use a conta que tem permissão de edição nos três documentos.<\/p><p class=\"help-text\" style=\"margin-top:12px\">A origem autorizada no Google precisa ser <code>https://wnetbr.github.io<\/code>. Origem atual: <code id=\"currentOrigin\"><\/code>.<\/p><p class=\"help-text\" style=\"margin-top:12px\">Quando a autorização expirar, clique em Reconectar Google. Sair remove a autorização salva deste navegador. Em outro dispositivo ou após limpar os dados do site, será preciso entrar novamente. Sua senha não é armazenada pelo painel.<\/p><\/details><\/div><\/div><\/div><\/section>\n<footer class=\"footer\"><span>Wnet © <span id=\"year\"><\/span> · Central de controle<\/span><span id=\"lastSync\">Nenhuma sincronização realizada<\/span><\/footer>\n<\/main><\/div>\n<dialog id=\"editDialog\"><form id=\"editForm\"><h2 id=\"editTitle\">Novo acesso<\/h2><p>Informe exatamente o nome ou a senha reconhecida pelo aplicativo.<\/p><label for=\"userValue\">Nome ou senha<\/label><input id=\"userValue\" required autocomplete=\"off\" spellcheck=\"false\" maxlength=\"500\"><p id=\"editError\" class=\"small\" style=\"color:var(--red);margin-top:10px\" role=\"alert\"><\/p><div class=\"dialog-actions\"><button type=\"button\" id=\"cancelEdit\">Cancelar<\/button><button class=\"primary\" type=\"submit\">Aplicar à lista<\/button><\/div><\/form><\/dialog>\n<dialog id=\"confirmDialog\"><h2 id=\"confirmTitle\"><\/h2><p id=\"confirmBody\" style=\"white-space:pre-line\"><\/p><div class=\"dialog-actions\"><button id=\"confirmNo\">Cancelar<\/button><button id=\"confirmYes\" class=\"primary\">Confirmar<\/button><\/div><\/dialog><div id=\"toast\" class=\"toast\" role=\"status\" hidden><\/div>\n<script>\n'use strict';\n// Identificador público do painel Wnet. A autorização continua sendo feita pelo Google.\nconst GOOGLE_CLIENT_ID = '849543953198-v9072rdjjqpni2t199f9c8rj1and6sv8.apps.googleusercontent.com';\nconst SOURCES={users:{id:'1DvccLtkMtncHW-w7xGc5VjjfIfESZBByErCiw0Sk5kY',name:'Acessos',icon:'users'},access:{id:'1pgboYD9IgtQKPyf6o9jHf0x0AK2uGRvzdP-Zab5NAdw',name:'Tela de acesso',icon:'lock'},config:{id:'1WZXRU9iPJq15soIlkTAotMA7Y9KB0VxotW28pSjgRSM',name:'Configuração VPN',icon:'server'}};\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst escapeHTML=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst state={token:'',expires:0,busy:false,page:'overview',show:false,editing:-1,logs:[],docs:{},session:0};\nconst blank=()=>({loaded:false,text:'',draft:'',revision:'',tabId:'',end:1,dirty:false,conflict:false,error:'',verified:false});\nObject.keys(SOURCES).forEach(k=>state.docs[k]=blank());\nconst storage={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{notify('O navegador não permitiu guardar a preferência.',true)}}};\n\n// Separado por caminho: repositórios diferentes no mesmo domínio não compartilham a sessão do painel.\nconst SESSION_KEY='wnet.auth.v1:'+location.pathname;\nconst REMEMBER_KEY=SESSION_KEY+':remember';\nconst KNOWN_KEY=SESSION_KEY+':known';\nfunction clearCachedAuthorization(){try{localStorage.removeItem(SESSION_KEY)}catch{}}\nfunction persistAuthorization(){\n if(!$('#rememberLogin').checked){clearCachedAuthorization();return}\n try{localStorage.setItem(SESSION_KEY,JSON.stringify({token:state.token,expires:state.expires,clientId:clientID()}));localStorage.setItem(KNOWN_KEY,clientID())}\n catch{notify('Conectado, mas o navegador não permitiu guardar a autorização. Ao reabrir será preciso conectar novamente.',true)}\n}\nfunction restoreAuthorization(){\n if(!$('#rememberLogin').checked){clearCachedAuthorization();return false}\n try{const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');\n  if(!saved)return false;\n  if(saved.clientId!==clientID()||typeof saved.token!=='string'||!saved.token||!Number.isFinite(saved.expires)||saved.expires<=Date.now()){clearCachedAuthorization();return false}\n  state.token=saved.token;state.expires=saved.expires;return true;\n }catch{clearCachedAuthorization();return false}\n}\n\n$('#clientId').value=GOOGLE_CLIENT_ID||storage.get('wnet.clientId')||'';\n$('#rememberLogin').checked=storage.get(REMEMBER_KEY)!=='false';\n$('#rememberLogin').onchange=()=>{storage.set(REMEMBER_KEY,String($('#rememberLogin').checked));if($('#rememberLogin').checked&&signed())persistAuthorization();else clearCachedAuthorization()};\n$('#autoRefresh').checked=storage.get('wnet.autoRefresh')!=='false';\n$('#currentOrigin').textContent=location.protocol==='file:'?'Abra pelo endereço HTTPS do GitHub Pages.':location.origin;\n$('#year').textContent=new Date().getFullYear();\nfunction notify(message,error=false){$('#toast').textContent=message;$('#toast').classList.toggle('error',error);$('#toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').hidden=true,6500)}\nfunction showError(message){$('#globalError').textContent=message;$('#globalError').hidden=!message}\nfunction log(message){state.logs.unshift({message,time:new Date().toLocaleTimeString('pt-BR')});state.logs=state.logs.slice(0,6);$('#activity').innerHTML=state.logs.map(x=>`<div class=\"activity\"><i class=\"dot\"><\/i><div><p>${escapeHTML(x.message)}<\/p><small>${x.time}<\/small><\/div><\/div>`).join('')}\nfunction navigate(page){state.page=page;$$('.section').forEach(x=>x.hidden=x.id!==page);$$('.nav button').forEach(x=>{x.classList.toggle('active',x.dataset.page===page);if(x.dataset.page===page)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')})}\n$$('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));\nfunction signed(){return !!state.token&&Date.now()<state.expires}\nfunction updateStatus(){const online=signed();$('#connection').classList.toggle('online',online);$('#connection span').textContent=online?'Google conectado':'Google desconectado';$('#login').hidden=online;$('#login').textContent=storage.get(KNOWN_KEY)===clientID()?'Reconectar Google':'Conectar Google';$('#logout').hidden=!state.token;$('#refresh').disabled=!online||state.busy;$('#logout').disabled=state.busy;$('#saveClient').disabled=state.busy;$('#connectSetup').disabled=state.busy||online;$('#heroStatus').textContent=online?'Conexão autorizada':'Aguardando conexão';\nfor(const k of Object.keys(SOURCES)){const d=state.docs[k];const el=$('#'+k+'Status');el.textContent=d.conflict?'Alteração externa detectada. Descarte o rascunho para recarregar.':d.error||(!d.loaded?'Aguardando leitura':d.dirty function assinatura(u){return JSON.stringify([u.usuario,u.senha,u.ativo])}
function abrirPainel(u){
  try{sessionStorage.setItem(CHAVE_ACESSO,assinatura(u))}catch{}
  document.open();document.write(painelOriginal);document.close();
  const montar=()=>{
    const botao=document.createElement('button');
    botao.textContent='Bloquear painel';

    botao.onclick=()=>{try{sessionStorage.removeItem(CHAVE_ACESSO)}catch{}location.reload()};

let salvo='';try{salvo=sessionStorage.getItem(CHAVE_ACESSO)||''}catch{}

  const form=document.getElementById('formAcesso');
  form.onsubmit=e=>{
    e.preventDefault();
